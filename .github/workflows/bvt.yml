name: SauceDemo BVT

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bvt:
    runs-on: macos-latest
    # First-run engine/browser provisioning can exceed 20 minutes on hosted macOS.
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run Katalon BVT
        uses: katalon-studio/katalon-studio-github-action@v4.0
        with:
          version: '11.4.0'
          projectPath: '${{ github.workspace }}'
          args: >-
            -noSplash -runMode=console -retry=0 -maxFailedTests=1
            -testSuitePath="Test Suites/TS_BVT"
            -browserType="Chrome (headless)" -executionProfile="QA"
            -apiKey=${{ secrets.KATALON_API_KEY }}
            -reportFolder="${{ github.workspace }}/Reports/BVT-${{ github.run_id }}"
            --config -webui.autoUpdateDrivers=true
      - name: Publish Katalon reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: katalon-bvt-reports-${{ github.run_number }}
          path: Reports/
          if-no-files-found: error
