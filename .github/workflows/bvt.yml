name: SauceDemo BVT

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bvt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Pull pinned Katalon image
        run: docker pull katalonstudio/katalon:11.4.0-slim
      - name: Run Katalon BVT
        env:
          KATALON_API_KEY: ${{ secrets.KATALON_API_KEY }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/tmp/project" \
            -w /tmp/project \
            katalonstudio/katalon:11.4.0-slim \
            katalonc.sh \
              -projectPath=/tmp/project \
              -retry=0 \
              -maxFailedTests=1 \
              -testSuitePath="Test Suites/TS_BVT" \
              -browserType="Edge Chromium" \
              -executionProfile="QA" \
              -apiKey="$KATALON_API_KEY" \
              -reportFolder="/tmp/project/Reports/BVT-${{ github.run_id }}" \
              --config -webui.autoUpdateDrivers=true
      - name: List reports
        if: always()
        run: find Reports -maxdepth 4 -type f -print 2>/dev/null || true
      - name: Publish Katalon reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: katalon-bvt-reports-${{ github.run_number }}
          path: Reports/
          if-no-files-found: ignore
